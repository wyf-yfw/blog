<main id="main">

    <div class="page-head">
      <h1 class="page-head__title">友链</h1>
      <p class="page-head__desc">朋友们的站点。</p>
    </div>
    <div class="friends" data-links></div>
    <p class="empty" data-links-empty>还没有友链。</p>
    <section class="friend-apply" aria-labelledby="link-apply-title">
      <h2 id="link-apply-title" class="friend-apply__title">申请友链</h2>
      <p class="friend-apply__desc">留下站点名、网址和一句介绍。我看过并同意之后，才会出现在上面。</p>
      <form class="gb__form" data-link-form>
        <p class="gb__honey" aria-hidden="true">
          <label>不要填 <input name="bot-field" tabindex="-1" autocomplete="off"></label>
        </p>
        <label class="gb__label">站点名
          <input class="gb__input" name="name" type="text" required maxlength="40" placeholder="站点名" autocomplete="organization">
        </label>
        <label class="gb__label">网址
          <input class="gb__input" name="url" type="url" required maxlength="300" placeholder="https://" inputmode="url" autocomplete="url">
        </label>
        <label class="gb__label">介绍
          <input class="gb__input" name="note" type="text" maxlength="80" placeholder="一句介绍，可以空着">
        </label>
        <div class="gb__actions">
          <button class="gb__submit" type="submit">提交申请</button>
          <p class="gb__status" data-link-status role="status"></p>
        </div>
      </form>
    </section>
  </div>
