name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只跑一个部署，后推的覆盖前一个
concurrency:
  group: deploy-kriswang
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 跑测试
        run: npm test

      - name: 没有令牌时说明原因
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::notice title=跳过部署::仓库里还没有配置 CLOUDFLARE_API_TOKEN，这次只跑了测试。"
          echo "配置方法：Settings → Secrets and variables → Actions → New repository secret"

      - name: 戳资源版本号
        run: node scripts/stamp-version.mjs "${GITHUB_SHA::8}"

      - name: 部署到 Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: 6f6313228c73cdb5db875d457647bb2e
          command: deploy
