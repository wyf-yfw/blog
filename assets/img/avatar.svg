<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="头像占位图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3C556E"/>
      <stop offset="55%" stop-color="#22303F"/>
      <stop offset="100%" stop-color="#111820"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.3" cy="0.24" r="0.75">
      <stop offset="0%" stop-color="#9FC3E4" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#9FC3E4" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="240" height="240" fill="url(#bg)"/>
  <circle cx="72" cy="58" r="100" fill="url(#halo)"/>

  <g fill="none" stroke="#9FC3E4" stroke-opacity="0.13" stroke-width="1">
    <path d="M-10 176c46-26 92-26 138 0s92 26 138 0"/>
    <path d="M-10 194c46-26 92-26 138 0s92 26 138 0"/>
    <path d="M-10 212c46-26 92-26 138 0s92 26 138 0"/>
  </g>

  <text x="120" y="152"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="104" font-weight="600" text-anchor="middle"
        fill="#E7EBF0" fill-opacity="0.92"
        letter-spacing="-2">K</text>

  <rect width="240" height="240" filter="url(#grain)" opacity="0.06"/>
</svg>
